<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grimório de Drinks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --paper:#faf8f3; --ink:#26221d; --muted:#7a7165; --rule:#ddd5c7; --accent:#7d2a22;
  --ff-display:"Cormorant Garamond","Garamond",Georgia,serif;
  --ff-body:"EB Garamond","Garamond",Georgia,serif;
  --header-h:48px;
  color-scheme:light;
}

/* ── reset ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;
  background:var(--paper);color:var(--ink);
  font-family:var(--ff-body);font-size:17px;line-height:1.55;
  font-variant-numeric:oldstyle-nums;
}
button{all:unset;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:1px dotted var(--accent);outline-offset:3px;
}
a{color:inherit}
.sc{font-variant-caps:all-small-caps;letter-spacing:.08em}

/* ── layout raiz: header + corpo ── */
.root{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── header compacto ── */
header.top{
  flex:none;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  padding:0 24px;
  height:var(--header-h);
  border-bottom:1px solid var(--rule);
  background:var(--paper);
}
header.top h1{
  font-family:var(--ff-display);font-weight:500;
  font-size:22px;line-height:1;white-space:nowrap;letter-spacing:.01em;
}
.units{
  display:flex;flex-wrap:nowrap;align-items:baseline;
  gap:4px 10px;font-size:14px;color:var(--muted);
}
.units button{color:var(--muted)}
.units button[aria-pressed="true"]{
  color:var(--ink);text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:1px;
}
.units select{
  font:inherit;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--rule);padding:0 2px;
}

/* ── corpo: três colunas ── */
.body{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:220px 200px minmax(0,1fr);
}

/* ── painel genérico ── */
.panel{
  overflow-y:auto;overflow-x:hidden;
  padding:16px 18px;
  border-right:1px solid var(--rule);
}
.panel:last-child{border-right:0}

/* scrollbar discreta */
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-track{background:transparent}
.panel::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

/* ── painel 1: filtros ── */
.filters{display:flex;flex-direction:column;gap:14px}
.search{
  width:100%;font:inherit;font-style:italic;
  padding:3px 0;border:0;border-bottom:1px solid var(--rule);
  background:transparent;color:var(--ink);font-size:15px;
}
.search::placeholder{color:var(--muted)}
.fgroup{display:flex;flex-direction:column;gap:3px}
.fgroup h3{font-weight:500;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:0 10px;font-size:14.5px}
.chip{color:var(--muted);line-height:1.6}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ── painel 2: lista ── */
.list-panel{display:flex;flex-direction:column;gap:6px}
.count{font-size:13px;color:var(--muted);font-style:italic}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule);padding-top:6px}
.item{
  display:flex;align-items:baseline;gap:5px;
  padding:3px 0;font-size:16px;width:100%;
}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.item .fv{color:var(--accent);font-size:11px;flex:none}
.item .meta{font-style:italic;font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.item:hover .nm{color:var(--accent)}
.item[aria-current="true"] .nm{color:var(--accent);font-style:italic}
.empty{padding:6px 0;color:var(--muted);font-style:italic;font-size:15px}

/* ── painel 3: detalhe ── */
.detail-panel{padding:20px 28px 40px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
.head h2{
  font-family:var(--ff-display);
  font-size:clamp(32px,4vw,52px);
  font-weight:500;line-height:1;text-wrap:balance;
}
.star{font-size:14px;color:var(--muted);font-style:italic}
.star[aria-pressed="true"]{color:var(--accent)}
.tags{margin:6px 0 0;color:var(--muted);font-size:14px}
.summary{max-width:62ch;margin:12px 0 22px;font-size:17px}

.versions{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:28px 0;
  border-top:1px solid var(--rule);
  padding-top:18px;
}
.v{padding:0 20px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;min-width:0}
.v .bk{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.v .bk .yr{color:var(--accent)}
.v h4{font-family:var(--ff-display);font-style:italic;font-weight:500;font-size:21px;line-height:1.15}
.method{font-size:13px;color:var(--muted);font-style:italic;margin-top:-4px}
ul.ing{list-style:none;font-size:15px}
ul.ing li{display:flex;align-items:baseline;gap:6px;padding:1px 0}
ul.ing .nmi{min-width:0}
ul.ing .lead{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px);min-width:10px}
ul.ing .q{white-space:nowrap;font-variant-numeric:lining-nums tabular-nums;font-size:14px}
ul.ing .q.approx{color:var(--muted)}
.prep{font-size:15px;hyphens:auto}
.note-txt{font-size:14px;color:var(--muted);font-style:italic}
details.orig{font-size:14px}
details.orig summary{cursor:pointer;color:var(--muted);list-style:none}
details.orig summary::-webkit-details-marker{display:none}
details.orig summary:hover,details.orig[open] summary{color:var(--accent)}
details.orig p{margin:4px 0 0;font-style:italic}
.serves{color:var(--accent);font-style:normal}

.notes{margin-top:36px;max-width:600px}
.notes h3{font-family:var(--ff-display);font-weight:500;font-size:22px;margin-bottom:4px}
.notes textarea{
  font:inherit;width:100%;min-height:100px;
  padding:2px 0;border:0;background:transparent;color:var(--ink);
  resize:vertical;line-height:30px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule) 29px,var(--rule) 30px);
  background-attachment:local;
}
.notes textarea::placeholder{color:var(--muted);font-style:italic}
.notes .st{font-size:13px;color:var(--muted);font-style:italic}

#loading{
  grid-column:1/-1;
  text-align:center;padding:80px 0;color:var(--muted);font-style:italic;
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="root">

  <!-- header compacto -->
  <header class="top">
    <h1>Grimório</h1>
    <div class="units" role="group" aria-label="Unidades">
      <span>Doses</span>
      <button id="u-orig" aria-pressed="true">como na fonte</button>
      <span>·</span>
      <button id="u-ml" aria-pressed="false">em mililitros</button>
      <span>·</span>
      <label for="size">partes para</label>
      <select id="size">
        <option value="60">60 ml</option>
        <option value="75" selected>75 ml</option>
        <option value="90">90 ml</option>
      </select>
    </div>
  </header>

  <!-- corpo -->
  <div class="body">

    <!-- painel 1: filtros -->
    <div class="panel">
      <div class="filters">
        <input id="q" class="search" type="search" placeholder="nome ou ingrediente…" aria-label="Buscar">
        <div class="fgroup"><h3>Fonte</h3><div class="chips" id="f-book"></div></div>
        <div class="fgroup"><h3>Base</h3><div class="chips" id="f-base"></div></div>
        <div class="fgroup"><h3>Método</h3><div class="chips" id="f-method"></div></div>
        <div class="fgroup"><div class="chips"><button class="chip" id="f-fav" aria-pressed="false">só favoritos ✦</button></div></div>
      </div>
    </div>

    <!-- painel 2: lista -->
    <div class="panel">
      <div class="list-panel">
        <div id="loading">Carregando…</div>
        <div class="count" id="count" hidden></div>
        <div class="list" id="list" role="list"></div>
      </div>
    </div>

    <!-- painel 3: detalhe -->
    <div class="panel detail-panel" id="detail" aria-live="polite"></div>

  </div><!-- /body -->
</div><!-- /root -->

<script>
// ─── conversões ───────────────────────────────────────────────────────────────
const JUICE_ML = {"laranja":80,"limão":30,"limão-siciliano":40,"limão siciliano":40};
const UNIT_ML  = {oz:30,jig:45,jigger:45,pony:30,med:30,tsp:5,tbsp:15,gl:60,vl:40,wg:60};

const FR = [[1/12,"1⁄12"],[1/8,"⅛"],[1/6,"⅙"],[1/4,"¼"],[1/3,"⅓"],[3/8,"⅜"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"]];
function frac(x){const w=Math.floor(x+1e-9),r=x-w;if(r<1e-6)return String(w);for(const[v,s]of FR)if(Math.abs(r-v)<1e-3)return(w?w:"")+s;return x.toFixed(2)}

function qtyOrig(q){
  const{q:v,u,i}=q;
  if(u==="qs"||v==null)return"—";
  if(u==="p")return frac(v)+" parte";
  if(u==="dash")return v+(v>1?" dashes":" dash");
  if(u==="drop")return v+(v>1?" gotas":" gota");
  if(u==="un")return frac(v);
  if(u==="j")return frac(v)+(v>1?" frutas":v===1?" fruta":" da fruta");
  if(u==="ml")return v+" ml";
  const label={oz:"oz",jig:"jigger",pony:"pony",med:"medida",tsp:"c. chá",tbsp:"c. sopa",gl:"copo",vl:"verre à liqueur",wg:"wineglass"}[u]||u;
  return frac(v)+" "+label;
}

function qtyMl(q,size,sv){
  const{q:v,u,i}=q;
  if(u==="qs"||v==null)return{t:"—"};
  if(u==="dash"||u==="drop"||u==="un")return{t:qtyOrig(q)};
  let ml=null,ap=false;
  if(u==="p"){ml=v*size}
  else if(u==="j"){const k=Object.keys(JUICE_ML).find(k=>i.toLowerCase().includes(k))||"limão";ml=v*JUICE_ML[k];ap=true}
  else if(u==="ml"){ml=v}
  else{ml=v*(UNIT_ML[u]||30);ap=!!(UNIT_ML[u]&&u!=="ml")}
  if(sv)ml/=sv;
  const r=ml<10?Math.round(ml*2)/2:Math.round(ml);
  return{t:(ap?"≈ ":"")+r+" ml",ap};
}

// ─── estado ───────────────────────────────────────────────────────────────────
const st={q:"",books:new Set(),base:new Set(),method:new Set(),fav:false,unit:"orig",size:75,cur:null};
let USER={},BOOKS={},DRINKS=[],ORDER=[],IDX=[];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

try{const p=JSON.parse(localStorage.getItem("grim-prefs")||"{}");if(p.unit)st.unit=p.unit;if(p.size)st.size=+p.size;if(p.cur)st.cur=p.cur}catch(e){}
try{USER=JSON.parse(localStorage.getItem("grim-user")||"{}")}catch(e){}
function savePrefs(){try{localStorage.setItem("grim-prefs",JSON.stringify({unit:st.unit,size:st.size,cur:st.cur}))}catch(e){}}
function saveUser(){try{localStorage.setItem("grim-user",JSON.stringify(USER))}catch(e){}}

// ─── carregar dados ───────────────────────────────────────────────────────────
fetch("data/drinks.json")
  .then(r=>r.json())
  .then(data=>{
    BOOKS=data.books;DRINKS=data.drinks;ORDER=Object.keys(BOOKS);
    IDX=DRINKS.map(c=>({c,txt:norm([c.n,c.base,c.s,...c.versions.flatMap(v=>[v.t,v.prep||"",v.original||"",...(v.ingredients||[]).map(i=>i.i)])].join(" "))}));

    $("#loading").hidden=true;
    $("#count").hidden=false;

    chips($("#f-book"),ORDER,st.books,k=>esc(BOOKS[k].t));
    chips($("#f-base"),[...new Set(DRINKS.map(c=>c.base))],st.base);
    chips($("#f-method"),["Batido","Mexido","Montado"],st.method);
    $("#f-fav").onclick=e=>{st.fav=!st.fav;e.currentTarget.setAttribute("aria-pressed",st.fav);render()};
    $("#q").addEventListener("input",e=>{st.q=e.target.value;render()});
    setUnit(st.unit);
    $("#size").value=String(st.size);
    $("#size").onchange=e=>{st.size=+e.target.value;savePrefs();renderDetail()};
    render();
  })
  .catch(()=>{$("#loading").textContent="Erro ao carregar. Use npx serve . localmente ou Vercel."});

// ─── UI ───────────────────────────────────────────────────────────────────────
function setUnit(u){
  st.unit=u;
  $("#u-orig").setAttribute("aria-pressed",u==="orig");
  $("#u-ml").setAttribute("aria-pressed",u==="ml");
  savePrefs();renderDetail();
}
$("#u-orig").onclick=()=>setUnit("orig");
$("#u-ml").onclick=()=>setUnit("ml");

function chips(el,vals,set,label){
  el.innerHTML="";
  vals.forEach(v=>{
    const b=document.createElement("button");
    b.className="chip";b.setAttribute("aria-pressed","false");
    b.innerHTML=label?label(v):esc(v);
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.setAttribute("aria-pressed",set.has(v));render()};
    el.appendChild(b);
  });
}

function filtered(){
  const q=norm(st.q.trim());
  return IDX.filter(({c,txt})=>{
    if(q&&!q.split(/\s+/).every(w=>txt.includes(w)))return false;
    if(st.books.size&&!c.versions.some(v=>st.books.has(v.b)))return false;
    if(st.base.size&&!st.base.has(c.base))return false;
    if(st.method.size&&!st.method.has(c.m))return false;
    if(st.fav&&!USER[c.id]?.fav)return false;
    return true;
  }).map(x=>x.c);
}

function render(){
  const L=filtered(),el=$("#list");
  el.innerHTML="";
  $("#count").textContent=`${L.length} de ${DRINKS.length}`;
  if(!L.length){
    el.innerHTML=`<div class="empty">${st.fav?"Marque favoritos com ✦ na ficha.":"Nenhum resultado."}</div>`;
  }
  L.forEach(c=>{
    const b=document.createElement("button");
    b.className="item";b.setAttribute("role","listitem");
    b.setAttribute("aria-current",c.id===st.cur);
    b.innerHTML=`<span class="nm">${esc(c.n)}</span>${USER[c.id]?.fav?'<span class="fv">✦</span>':''}<span class="meta">${esc(c.base.toLowerCase())}</span>`;
    b.onclick=()=>{st.cur=c.id;savePrefs();render()};
    el.appendChild(b);
  });
  if(!st.cur||!DRINKS.find(c=>c.id===st.cur))st.cur=(L[0]||DRINKS[0]).id;
  renderDetail();
}

function renderDetail(){
  const c=DRINKS.find(x=>x.id===st.cur);
  if(!c)return;
  const u=USER[c.id]||{};
  const vs=[...c.versions].sort((a,b)=>ORDER.indexOf(a.b)-ORDER.indexOf(b.b));
  const years=c.versions.map(v=>BOOKS[v.b]?.y).filter(Boolean);
  const yr=years.length?(Math.min(...years)===Math.max(...years)?String(Math.min(...years)):`${Math.min(...years)}–${Math.max(...years)}`):"";

  $("#detail").innerHTML=`
    <div class="head">
      <h2>${esc(c.n)}</h2>
      <button class="star" id="star" aria-pressed="${!!u.fav}">${u.fav?"✦ nos favoritos":"guardar nos favoritos"}</button>
    </div>
    <div class="tags">${esc(c.base)} · ${esc(c.m.toLowerCase())} · ${c.versions.length} versão${c.versions.length>1?"ões":""}${yr?" · "+yr:""}</div>
    <p class="summary">${esc(c.s)}</p>
    <div class="versions">${vs.map(v=>card(v)).join("")}</div>
    <div class="notes">
      <h3>Notas de bancada</h3>
      <textarea id="note" placeholder="Ex.: Bottoms Up com Tanqueray ficou seco demais; próxima vez 4:1.">${esc(u.note||"")}</textarea>
      <span class="st" id="nstat">Salvo neste navegador.</span>
    </div>`;

  $("#star").onclick=()=>save(c.id,{fav:!u.fav});
  const ta=$("#note");let tmr;
  ta.addEventListener("input",()=>{
    clearTimeout(tmr);$("#nstat").textContent="Salvando…";
    tmr=setTimeout(()=>save(c.id,{note:ta.value}),700);
  });
}

function card(v){
  const B=BOOKS[v.b]||{};
  const rows=(v.ingredients||[]).map(q=>{
    const r=st.unit==="ml"?qtyMl(q,st.size,v.serves):{t:qtyOrig(q)};
    const has=r.t!=="—";
    return`<li><span class="nmi">${esc(q.i)}</span>${has?`<span class="lead"></span><span class="q${r.ap?" approx":""}">${esc(r.t)}</span>`:""}</li>`;
  }).join("");
  const srcLink=v.source_url?`<a href="${esc(v.source_url)}" target="_blank" rel="noopener" style="color:var(--muted);font-size:12px">fonte ↗</a>`:"";
  return`<article class="v">
    <div class="bk"><span class="sc">${esc(B.t||v.b)}</span><span class="yr">${B.y||""}${srcLink?" · "+srcLink:""}</span></div>
    <h4>${esc(v.t)}</h4>
    <div class="method">${esc(v.m.toLowerCase())}${v.serves?` · <span class="serves">para ${v.serves} pessoas</span>`:""}</div>
    <ul class="ing">${rows}</ul>
    <p class="prep">${esc(v.prep||"")}</p>
    ${v.note?`<p class="note-txt">${esc(v.note)}</p>`:""}
    ${v.original?`<details class="orig"><summary>ver o original em ${esc(B.lang||"inglês")} ›</summary><p>${esc(v.original)}</p></details>`:""}
  </article>`;
}

function save(id,patch){
  USER[id]={...(USER[id]||{}),...patch};
  if("fav"in patch)render();
  saveUser();
  const n=$("#nstat");if(n)n.textContent="Salvo neste navegador.";
}
</script>
</body>
</html>
